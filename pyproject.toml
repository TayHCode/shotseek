[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shotseek"
version = "0.1.0"
description = "Local photo and video search for agents"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "TayHCode"}]
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "Pillow>=10.1", "pillow-heif>=0.16", "opencv-python-headless>=4.10", "torch>=2.2", "torchvision>=0.17", "open_clip_torch>=2.24", "faster-whisper>=1.0", "av>=11,<19"]

[project.scripts]
shotseek = "shotseek.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shotseek = ["agent/guide.md", "schemas/*.json"]

[tool.ruff.lint]
# Keep syntax and import checks stable across Ruff releases.
select = ["E4", "E7", "E9", "F"]
